# The web API: 2 copies (replicas) behind one Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: filing-analyst
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # never go below 2 ready copies during an update
      maxSurge: 1        # start one new copy at a time
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # the image's own user, by number
        runAsGroup: 10001
      containers:
        - name: api
          image: filing-analyst:v1
          imagePullPolicy: Never  # the image is loaded into the cluster by k8s/up.sh
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: filing-analyst-config}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: filing-analyst-secrets, key: PGPASSWORD}
            - name: FILING_ANALYST_API_KEY
              valueFrom:
                secretKeyRef: {name: filing-analyst-secrets, key: FILING_ANALYST_API_KEY}
          # Startup: loading the models takes a few seconds. Liveness waits for this.
          startupProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 2
            failureThreshold: 60
          # Liveness: "is the process stuck?" A failure restarts the pod. It
          # never checks the database: a restart cannot fix a database outage.
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: "should this pod get traffic?" /health answers 503 while
          # the database is unreachable, which takes the pod out of traffic
          # without restarting it.
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 2
          lifecycle:
            # When a pod is told to stop, keep serving for a few seconds while
            # the Service stops sending it new requests, so none are cut off.
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 400Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: filing-analyst
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080  # mapped to 127.0.0.1:8080 on this machine by kind-config.yaml
