# The whole service in containers: Postgres with pgvector, a one time step that
# builds the search index into it, and the web API.
#
#   1. Put a database password in a file named .env next to this one:
#        POSTGRES_PASSWORD=<letters and digits, e.g. from: openssl rand -hex 24>
#   2. docker compose up --build -d
#   3. curl localhost:8000/health
#
# The first start builds the index from ./data (a few minutes). The index lives
# in the "pgdata" volume, so later starts skip that step and are quick.
# Rebuild it on purpose with:
#   docker compose run --rm ingest python -m filing_analyst ingest /data/filings

x-app: &app
  build: .
  image: filing-analyst:latest
  environment: &app-env
    # Where the index is: the db service below. No password in the address:
    # Postgres reads it from PGPASSWORD, so it never shows in addresses or logs.
    FILING_ANALYST_INDEX: postgresql://filing@db:5432/filing
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file next to docker-compose.yml (see README)}
  # Extra lock down: the container's own files are read only (only /tmp is
  # writable), it cannot gain new privileges, and it has no special Linux powers.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: pgvector/pgvector:0.8.2-pg17-trixie
    ports:
      # This machine only; 5433 so it cannot clash with a Postgres already installed on 5432.
      - "127.0.0.1:${FILING_ANALYST_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: filing
      POSTGRES_DB: filing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file next to docker-compose.yml (see README)}
    volumes:
      - pgdata:/var/lib/postgresql/data  # the database, and so the index, survives restarts here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filing -d filing"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Runs once per `up` and then exits. It builds the index only if the database
  # does not already hold one made with the current model.
  ingest:
    <<: *app
    command: ["python", "-m", "filing_analyst", "ingest", "/data/filings", "--if-empty"]
    volumes:
      - "${FILING_ANALYST_DATA_DIR:-./data}:/data/filings:ro"  # the downloaded filings, read only
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true  # the image's check asks the web server, which this step does not run

  api:
    <<: *app
    ports:
      # 127.0.0.1 = only this machine can connect. Change it only after
      # setting FILING_ANALYST_API_KEY (see "Protecting it" in the README).
      - "127.0.0.1:${FILING_ANALYST_PORT:-8000}:8000"
    environment:
      <<: *app-env
      FILING_ANALYST_API_KEY: ${FILING_ANALYST_API_KEY:-}
      FILING_ANALYST_ASK_PER_MINUTE: ${FILING_ANALYST_ASK_PER_MINUTE:-10}
      FILING_ANALYST_ASK_GLOBAL_PER_MINUTE: ${FILING_ANALYST_ASK_GLOBAL_PER_MINUTE:-60}
      FILING_ANALYST_RERANK: ${FILING_ANALYST_RERANK:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully  # start only once the index is there
    restart: unless-stopped

volumes:
  pgdata:
